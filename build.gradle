buildscript {
	repositories {
		mavenCentral()
		maven {
            url "https://repo1.maven.org/maven2" 
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
	}
	dependencies {
      classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
         changing = true
     }
    }
}

apply plugin: 'forge'
apply plugin: 'idea'

System.setProperty("sun.net.client.defaultConnectTimeout", "5000") //5 seconds to connect
System.setProperty("sun.net.client.defaultReadTimeout", "10000") //10 seconds to read

sourceCompatibility = targetCompatibility = "1.8"
compileJava { sourceCompatibility = targetCompatibility = "1.8" }

ext.configFile = file "build.properties"
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse prop
}


version = "3.2.0"
group= "src.train" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "Fox-Traincraft"

configurations {
    shade
    compile.extendsFrom shade
}

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    replaceIn "Info.java"
    replace "@VERSION1@", config.modVersion.toString()
}

repositories {
    maven {
        url "https://jitpack.io"
    }
    maven {
        name "ChickenBones"
        url "http://chickenbones.net/maven/"
    }
   maven {
        url = "http://maven.cil.li/"
    }
}


dependencies {
    repositories {
        ivy {
            name "BuildCraft"
            artifactPattern "http://www.mod-buildcraft.com/releases/BuildCraft/[revision]/[module]-[revision](-[classifier]).[ext]"
        }
        maven {
            name "ChickenBones"
            url "http://chickenbones.net/maven/"
        }
    }
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
	
	compile "li.cil.oc:OpenComputers:MC1.7.10-1.7.5+:api"
    compile name: "buildcraft", version: "7.1.16", classifier: "dev"
	compile "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
	compile "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
	compile "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    compile "codechicken:ForgeMultipart:1.7.10-1.2.0.345:dev"
    //libraries for replacing the jukebox player. The top one is the one we actually use. The rest are for file types and various other things within java-stream-player
    shade 'com.github.goxr3plus:java-stream-player:10.0.2'
    shade 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    shade 'org.jflac:jflac-codec:1.5.2'
    shade 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    shade 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    shade 'com.googlecode.soundlibs:jorbis:0.0.17'
    shade 'com.github.goxr3plus:jaudiotagger:2.2.7'
    shade 'commons-io:commons-io:2.7'
    compile fileTree(dir: 'libs', include: ['*.jar'])
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Unit testing (added)
    testCompile 'junit:junit:4.13.2'
}

repositories {
    maven {
        name = "Mobius Repo"
        url = "http://mobiusstrip.eu/maven"
    }
}

dependencies {
    compile "mcp.mobius.waila:Waila:1.5.10_1.7.10:dev"
}

jar {
    def serviceEntries = [:].withDefault { [] }
    def tmpDir = file("$buildDir/mergedServices")

    configurations.shade.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.DSA'
            exclude 'META-INF/*.RSA'
            exclude 'META-INF/MANIFEST.MF'
            exclude 'META-INF/services/**'
        }

        def zip = new java.util.zip.ZipFile(dep)
        zip.entries().each { entry ->
            if (entry.name.startsWith('META-INF/services/') && !entry.isDirectory()) {
                def lines = zip.getInputStream(entry).text.trim()
                serviceEntries[entry.name].addAll(lines.split('\r?\n').findAll { !it.trim().isEmpty() })
            }
        }
        zip.close()
    }

    doFirst {
        if (tmpDir.exists()) tmpDir.deleteDir()

        serviceEntries.each { path, lines ->
            def f = file("$tmpDir/$path")
            f.parentFile.mkdirs()
            f.text = lines.unique().join('\n') + '\n'
        }
    }

    from(tmpDir)
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

idea
{
	module
	{
		inheritOutputDirs = true
	}
}
task sourceJar(type: Jar) {
	manifest {}
	classifier = 'sources'
	from sourceSets.main.allSource
	exclude 'assets/**'
}

task devJar(type: Jar) {
	manifest {}
	classifier = 'dev'
	from sourceSets.main.output
}

artifacts {
	archives devJar, sourceJar
}

uploadArchives {
    repositories {
        mavenDeployer {
            repository(url: "https://maven.pkg.github.com/bidahochi/Traincraft-5") {
                authentication(
                        userName: System.getenv("GITHUB_ACTOR"),
                        password: System.getenv("GITHUB_TOKEN")
                )
            }

            pom.project {
                groupId = "com.bidahochi.traincraft"
                artifactId = "fox-traincraft"
                version = project.version

                name = "Fox Traincraft"
                packaging = "jar"

                scm {
                    url = "https://github.com/bidahochi/Traincraft-5"
                }
            }
        }
    }
}

test {
    useJUnit()

    testLogging {
        events "passed", "skipped", "failed"
    }
}
